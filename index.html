<!doctype html>
<html lang="zh-CN" data-theme="red">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://free.picui.cn/free/2026/08/10/6a79704d1b417.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FF14、FC/CWLS 神無月 (Kannatsuki) のホームページです。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="神無月 · Kannatsuki" />
    <meta property="og:title" content="神無月 · Kannatsuki" />
    <meta property="og:description" content="FF14 Free Company & Cross-world Linkshell" />
    <title>神無月 · Kannatsuki</title>
    <script>
      // 持続化された主題を即時適用し、初回ロード時のちらつきを防止
      (function () {
        try {
          var raw = localStorage.getItem('kannatsuki-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'red' || t === 'blue') {
              document.documentElement.setAttribute('data-theme', t);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
